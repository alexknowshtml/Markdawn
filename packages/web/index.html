<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var isDark = localStorage.getItem('markdawn-theme') === 'dark' || ((!localStorage.getItem('markdawn-theme') || localStorage.getItem('markdawn-theme') === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#09090b';
            document.body && (document.body.style.backgroundColor = '#09090b');
          } else {
            document.documentElement.style.backgroundColor = '#ffffff';
            document.body && (document.body.style.backgroundColor = '#ffffff');
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdawn</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
