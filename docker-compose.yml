version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: markdawn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d markdawn"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - markdawn

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/markdawn
      GOOGLE_CLIENT_ID: "YOUR_GOOGLE_CLIENT_ID"
      GOOGLE_CLIENT_SECRET: "YOUR_GOOGLE_CLIENT_SECRET"
      GITHUB_CLIENT_ID: "YOUR_GITHUB_CLIENT_ID"
      GITHUB_CLIENT_SECRET: "YOUR_GITHUB_CLIENT_SECRET"
      FRONTEND_URL: "http://localhost:5173"
    ports:
      - "3001:3001"
    networks:
      - markdawn

  collab:
    build:
      context: .
      dockerfile: Dockerfile.collab
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/markdawn
      COLLAB_PORT: "1234"
    ports:
      - "1234:1234"
    networks:
      - markdawn

volumes:
  db_data:

networks:
  markdawn:
    driver: bridge
