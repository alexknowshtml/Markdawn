name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          podman version

      - name: Cache Podman container layers
        id: cache-podman
        uses: actions/cache@v4
        with:
          path: ~/.local/share/containers
          key: podman-${{ runner.os }}-postgres17-${{ hashFiles('packages/api/test/global-setup.ts', 'packages/collab/test/global-setup.ts', 'packages/api/src/db/schema.ts') }}
          restore-keys: |
            podman-${{ runner.os }}-postgres17-
            podman-${{ runner.os }}-

      - name: Pre-pull Postgres image (if cache miss)
        if: steps.cache-podman.outputs.cache-hit != 'true'
        run: podman pull postgres:17-alpine

      - name: Run all tests
        run: pnpm test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          podman version

      - name: Cache Podman container layers
        id: cache-podman
        uses: actions/cache@v4
        with:
          path: ~/.local/share/containers
          key: podman-${{ runner.os }}-postgres17-${{ hashFiles('packages/api/test/global-setup.ts', 'packages/collab/test/global-setup.ts', 'packages/api/src/db/schema.ts') }}
          restore-keys: |
            podman-${{ runner.os }}-postgres17-
            podman-${{ runner.os }}-

      - name: Pre-pull Postgres image (if cache miss)
        if: steps.cache-podman.outputs.cache-hit != 'true'
        run: podman pull postgres:17-alpine

      - name: Start database
        run: pnpm db:start

      - name: Push database schema
        run: pnpm --filter @markdawn/api db:push

      - name: Run E2E tests
        run: pnpm --filter @markdawn/web test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/web/test-results/
          retention-days: 7

      - name: Stop database
        if: always()
        run: pnpm db:stop

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
